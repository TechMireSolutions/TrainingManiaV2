version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: trainingmania-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainingmania}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainingmania_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-trainingmania_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainingmania} -d ${POSTGRES_DB:-trainingmania_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Node.js Express Backend Service
  # ==========================================
  backend:
    build:
      context: ./TrainingManiaBackend-Node
      dockerfile: Dockerfile
    container_name: trainingmania-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainingmania}:${POSTGRES_PASSWORD:-trainingmania_secure_password}@postgres:5432/${POSTGRES_DB:-trainingmania_db}?connection_limit=5&pool_timeout=10
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-trainingmania_secret_jwt_token_key_2026}
      EMAIL_HOST: ${EMAIL_HOST:-mail.techmiresolutions.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_SECURE: "true"
      EMAIL_USER: ${EMAIL_USER:-trainingmania@techmiresolutions.com}
      EMAIL_PASS: ${EMAIL_PASS:-!!YaHussain110!!}
      EMAIL_FROM: ${EMAIL_FROM:-trainingmania@techmiresolutions.com}
      EMAIL_BCC: ${EMAIL_BCC:-trainingmania@techmiresolutions.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 3. React Frontend Service (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./TrainingManiafrontend
      dockerfile: Dockerfile
    container_name: trainingmania-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
