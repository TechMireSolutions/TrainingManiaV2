name: Deploy Training Mania

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # 1. Environment Paths Load
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.npm-global/bin

            echo "🚀 1. Pulling latest code..."
            cd /www/wwwroot/trainingmania.techmiresolutions.com
            git reset --hard HEAD
            git pull origin main

            echo "📦 2. Setting up Backend..."
            cd TrainingManiaBackend-Node
            if [ ! -f .env ]; then
              cp .env.example .env
              sed -i 's/^PORT=.*/PORT=8008/' .env
              sed -i 's|^FRONTEND_URL=.*|FRONTEND_URL="https://trainingmania.techmiresolutions.com"|' .env
              grep -q "^NODE_ENV=" .env && sed -i 's/^NODE_ENV=.*/NODE_ENV=production/' .env || echo "NODE_ENV=production" >> .env
            fi

            npm install
            npx prisma db push --accept-data-loss
            npx prisma generate
            pm2 restart trainingmania-backend || pm2 start src/server.js --name "trainingmania-backend"
            pm2 save

            echo "🎨 3. Building Frontend..."
            cd ../TrainingManiafrontend
            echo "VITE_API_URL=/api" > .env
            npm install
            npm run build

            echo "🌐 4. Reloading Nginx..."
            nginx -s reload

            echo "✅ Training Mania Deployed Successfully!"
